plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.13'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.platzi'
/* version = '0.0.1-SNAPSHOT' */
version = '1.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa' //added springboot data(jpa repositories)
	implementation 'org.springframework.boot:spring-boot-starter-web'

	/*
	//swagger
	// Source: https://mvnrepository.com/artifact/io.springfox/springfox-swagger2
	implementation 'io.springfox:springfox-swagger2:3.0.0'
	//swagger ui
	// Source: https://mvnrepository.com/artifact/io.springfox/springfox-swagger-ui
	implementation 'io.springfox:springfox-swagger-ui:3.0.0' */

	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

	//postgres
	runtimeOnly 'org.postgresql:postgresql'

	//mapstruct
	implementation 'org.mapstruct:mapstruct:1.6.3'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

